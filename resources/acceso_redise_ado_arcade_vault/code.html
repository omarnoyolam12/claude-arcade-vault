<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Vignette */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
            z-index: 21;
        }
        
        .cyber-grid {
            position: absolute;
            bottom: 0; left: 0; right: 0; top: 0;
            background-image: 
                linear-gradient(rgba(0, 220, 229, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 220, 229, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(600px) rotateX(60deg);
            transform-origin: bottom center;
            z-index: 1;
            opacity: 0.4;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.95; }
        }

        .neon-border {
            border: 1px solid theme('colors.primary-fixed-dim');
        }
        
        .neon-glow-focus:focus-within {
            border-color: theme('colors.primary-fixed');
            box-shadow: 0 0 15px theme('colors.primary-fixed');
            outline: none;
        }

        .terminal-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid theme('colors.primary-fixed-dim');
            color: theme('colors.primary');
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        .terminal-input:focus {
            border-bottom-color: theme('colors.primary-fixed');
            box-shadow: 0 5px 15px -5px theme('colors.primary-fixed');
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px theme('colors.primary-fixed'), inset 0 0 5px rgba(255,255,255,0.5); }
            50% { box-shadow: 0 0 35px theme('colors.primary-fixed'), inset 0 0 15px rgba(255,255,255,0.8); }
            100% { box-shadow: 0 0 15px theme('colors.primary-fixed'), inset 0 0 5px rgba(255,255,255,0.5); }
        }

        .btn-primary {
            border: 3px solid theme('colors.primary-fixed');
            color: theme('colors.background');
            background-color: theme('colors.primary-fixed');
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            animation: pulse-glow 2s infinite;
        }

        .btn-primary:hover {
            transform: scale(1.05) rotate(-1deg);
            animation: none;
            box-shadow: 0 0 40px theme('colors.primary-fixed'), inset 0 0 20px theme('colors.background');
        }

        .btn-secondary {
            border: 2px solid theme('colors.secondary-container');
            color: theme('colors.secondary-container');
            background-color: transparent;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px rgba(255, 77, 128, 0.3);
        }

        .btn-secondary:hover {
            transform: scale(1.02) rotate(1deg);
            box-shadow: 0 0 25px theme('colors.secondary-container');
            background-color: rgba(255, 77, 128, 0.15);
            text-shadow: 0 0 8px theme('colors.secondary-container');
        }

        .auth-card {
            background-color: rgba(5, 5, 8, 0.85);
            position: relative;
            z-index: 10;
            border-radius: 12px;
        }
        
        .bezel {
            position: absolute;
            top: -16px; left: -16px; right: -16px; bottom: -16px;
            border: 16px solid #080808;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 2px 10px rgba(255,255,255,0.05), inset 0 0 30px rgba(0,0,0,1);
            z-index: -1;
            pointer-events: none;
        }
        
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(99, 247, 255, 0.03) 2px,
                rgba(99, 247, 255, 0.03) 4px
            );
            pointer-events: none;
            border-radius: 12px;
        }
        
        .tab-active {
            color: theme('colors.primary-fixed');
            border-bottom: 3px solid theme('colors.primary-fixed');
            text-shadow: 0 0 10px theme('colors.primary-fixed');
        }
        .tab-inactive {
            color: theme('colors.outline');
            border-bottom: 3px solid transparent;
        }
    </style>

<body class="min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-body-md" style="background-color: rgb(5, 5, 8);">
<div class="cyber-grid"></div>
<!-- Ambient Background Glows -->
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary-fixed rounded-full mix-blend-screen filter blur-[200px] opacity-10 pointer-events-none z-0"></div>
<div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-secondary-container rounded-full mix-blend-screen filter blur-[200px] opacity-10 pointer-events-none z-0"></div>
<main class="w-full max-w-lg px-margin z-10 relative mt-8 mb-8">
<!-- Logo Area -->
<div class="text-center mb-12 crt-flicker">

</div>

<div class="bezel"></div>
<!-- Tabs -->
<div class="flex mb-10 border-b border-outline-variant">
<button class="flex-1 pb-4 text-center font-label-lg text-label-lg uppercase tab-active transition-colors text-white" id="tab-login">

                </button>
<button class="flex-1 pb-4 text-center font-label-lg text-label-lg uppercase tab-inactive hover:text-primary-fixed hover:text-shadow-[0_0_10px_theme('colors.primary-fixed')] transition-all text-white" id="tab-register">
                    CREAR CUENTA
                </button>
</div>
<!-- Login Form -->
<form class="space-y-8" id="form-login">
<div class="relative group">
<label class="block font-label-sm text-label-sm mb-2 uppercase text-primary-fixed" for="login-username">Usuario</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline group-focus-within:text-primary-fixed transition-colors">person</span>
<input autocomplete="off" class="terminal-input w-full pl-10 py-3 font-body-lg text-body-lg bg-surface-container-low text-primary-fixed" id="login-username" placeholder="PLAYER_1" required="" type="text">
</div>
</div>
<div class="relative group">
<label class="block font-label-sm text-label-sm mb-2 uppercase text-primary-fixed" for="login-password">Contraseña</label>

<span class="material-symbols-outlined absolute left-0 text-outline group-focus-within:text-primary-fixed transition-colors">lock</span>
<input class="terminal-input w-full pl-10 py-3 font-body-lg text-body-lg bg-surface-container-low text-primary-fixed" id="login-password" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="pt-6 space-y-4">
<button class="btn-primary w-full py-4 font-headline-md text-headline-md flex items-center justify-center gap-3 border-2 border-primary-fixed shadow-[0_0_20px_theme('colors.primary-fixed')] brightness-125 text-white font-bold" type="submit">
<span class="material-symbols-outlined text-2xl" data-weight="fill">play_arrow</span>
                        INICIAR SESIÓN
                    </button>
<button class="btn-secondary w-full py-4 font-headline-md text-[14px] flex items-center justify-center gap-3 border-2 border-secondary-container shadow-[0_0_20px_theme('colors.secondary-container')] brightness-110 text-white font-bold" type="button">

                        JUGAR COMO INVITADO
                    </button>
</div>
<div class="text-center mt-6">
<a class="font-label-sm text-label-sm hover:text-primary-fixed transition-colors underline decoration-dashed underline-offset-4 drop-shadow-[0_0_5px_theme('colors.tertiary-fixed')] text-primary-fixed brightness-125" href="#">¿Olvidaste tu contraseña?</a>
</div>
</form>
<!-- Register Form (Hidden by default) -->
<form class="space-y-8 hidden" id="form-register">
<div class="relative group">
<label class="block font-label-sm text-label-sm mb-2 uppercase text-primary-fixed" for="reg-email">Correo electrónico</label>

<span class="material-symbols-outlined absolute left-0 text-outline group-focus-within:text-primary-fixed transition-colors">mail</span>

</div>
</div>
<div class="relative group">
<label class="block font-label-sm text-label-sm mb-2 uppercase text-primary-fixed" for="reg-username">Usuario</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline group-focus-within:text-primary-fixed transition-colors">badge</span>
<input class="terminal-input w-full pl-10 py-3 font-body-lg text-body-lg bg-surface-container-low text-primary-fixed" id="reg-username" placeholder="NEW_CHALLENGER" type="text">
</div>
</div>
<div class="relative group">
<label class="block font-label-sm text-label-sm mb-2 uppercase text-primary-fixed" for="reg-password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline group-focus-within:text-primary-fixed transition-colors">key</span>
<input class="terminal-input w-full pl-10 py-3 font-body-lg text-body-lg bg-surface-container-low text-primary-fixed" id="reg-password" placeholder="••••••••" type="password">
</div>
</div>
<div class="pt-6">
<button class="btn-primary w-full py-4 font-headline-md text-headline-md flex items-center justify-center gap-3 border-2 border-primary-fixed shadow-[0_0_20px_theme('colors.primary-fixed')] brightness-125 text-white font-bold" type="submit">
<span class="material-symbols-outlined text-2xl">add_circle</span>
                        REGISTRAR
                    </button>
</div>
</form>
</div>
</div>
</main>
<script>
        // Tab switching logic
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.replace('tab-inactive', 'tab-active');
            tabRegister.classList.replace('tab-active', 'tab-inactive');
            formLogin.classList.remove('hidden');
            formRegister.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.replace('tab-inactive', 'tab-active');
            tabLogin.classList.replace('tab-active', 'tab-inactive');
            formRegister.classList.remove('hidden');
            formLogin.classList.add('hidden');
        });
        
        // Add terminal cursor effect to active input
        const inputs = document.querySelectorAll('.terminal-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('neon-glow-focus');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('neon-glow-focus');
            });
        });
    </script>
