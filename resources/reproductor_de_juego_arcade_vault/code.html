<style>
        /* CRT Effects */
        .crt-scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }
        
        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        .crt-bezel {
            border-radius: 20px;
            box-shadow: inset 0 0 40px rgba(0,0,0,1), 
                        0 0 20px rgba(99,247,255,0.4);
            overflow: hidden;
            position: relative;
        }

        .crt-glass {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 40;
            border-radius: 20px;
        }

        .neon-border-cyan {
            border: 2px solid theme('colors.primary-fixed');
            box-shadow: 0 0 10px theme('colors.primary-fixed');
        }

        .neon-border-magenta {
            border: 2px solid theme('colors.secondary-container');
            box-shadow: 0 0 10px theme('colors.secondary-container');
        }

        .glitch-hover:hover {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            box-shadow: 0 0 20px theme('colors.primary-fixed');
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-5deg); }
            40% { transform: skew(5deg); }
            60% { transform: skew(-2deg); }
            80% { transform: skew(2deg); }
            100% { transform: skew(0deg); }
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
        
        /* Global scanline overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
